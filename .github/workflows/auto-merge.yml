# ORG-WIDE AUTO-MERGE DISPATCHER — installed in every opencharly repo.
name: auto-merge

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  engine:
    if: github.event.label.name == 'auto-merge'
    uses: opencharly/.github/.github/workflows/auto-merge-reusable.yml@main
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
