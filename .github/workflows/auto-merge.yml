name: auto-merge

on:
  workflow_run:
    workflows: ["charly/pr-validator"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head-sha:
        description: SHA of the PR head to merge
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check all statuses and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha || inputs.head-sha }}"
          STAMP=""

          # ---- Idempotent tag creation ----
          ensure_tag() {
            local ver="$1" ms="$2"
            if git rev-parse -q --verify "refs/tags/$ver" >/dev/null 2>&1; then
              echo "Tag $ver already exists"
              return 0
            fi
            if gh api -X POST "/repos/$REPO/git/refs" \
              -f ref="refs/tags/$ver" -f sha="$ms" >/dev/null 2>&1; then
              echo "Tagged $ver"
            else
              echo "Tag $ver already exists (concurrent mint)"
            fi
          }

          # ---- Tag version from the merge stamp ----
          tag_ver() {
            local stamp="$1" ddd rest doy hhmm
            if [ "$REPO" = "opencharly/sdk" ]; then
              ddd=${stamp%%.*}
              rest=${stamp#*.}
              doy=${rest%%.*}
              hhmm=${rest#*.}
              hhmm=${hhmm#0}; hhmm=${hhmm#0}; hhmm=${hhmm#0}; hhmm=${hhmm#0}
              [ -z "$hhmm" ] && hhmm=0
              printf 'v0.%s%s.%s' "$ddd" "$doy" "$hhmm"
            else
              printf 'v%s' "$stamp"
            fi
          }

          # ---- Locate the PR ----
          PR=$(gh api "/repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR found for head SHA $HEAD_SHA"
            exit 0
          fi
          echo "PR #$PR (head $HEAD_SHA)"

          STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
          if [ "$STATE" = "closed" ]; then
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty')
            if [ -n "$MS" ]; then
              VER="$(tag_ver "$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                --jq '.commit.committer.date')" +%Y.%j.%H%M)")"
              ensure_tag "$VER" "$MS"
            fi
            echo "PR #$PR already closed"
            exit 0
          fi

          BASE_REF=$(gh api "/repos/$REPO/pulls/$PR" --jq '.base.ref')
          HEAD=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.sha')

          # ---- Wait until EVERY status check has settled ----
          wait_all_settled() {
            local head="$1" label="$2" i pending total
            for i in $(seq 1 180); do
              pending=$(gh api "/repos/$REPO/commits/$head/check-runs" \
                --jq '[.check_runs[] | select(.status != "completed")] | length')
              total=$(( pending + $(gh api "/repos/$REPO/commits/$head/status" \
                --jq 'if .state == "pending" then ([.statuses[] | select(.state == "pending")] | length) else 0 end') ))
              if [ "$total" = "0" ]; then
                echo "$label: all status checks have completed"
                return 0
              fi
              echo "$label: $total check(s) still pending (attempt $i/180)"
              sleep 5
            done
            echo "Timed out waiting for status checks to complete"
            return 1
          }

          verify_all_green() {
            local head=$1 name conclusion state nstatuses all_green=true failed=""
            while IFS=$'\t' read -r name conclusion; do
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) all_green=false; failed="${failed} $name: ${conclusion};" ;;
              esac
            done < <(gh api "/repos/$REPO/commits/$head/check-runs" \
              --jq '.check_runs[] | [.name, (.conclusion // "null")] | @tsv')
            state=$(gh api "/repos/$REPO/commits/$head/status" --jq '.state')
            nstatuses=$(gh api "/repos/$REPO/commits/$head/status" --jq '.statuses | length')
            if [ "$nstatuses" -gt 0 ] && [ "$state" != "success" ]; then
              all_green=false
              failed="${failed} commit-status contexts (state=${state});"
            fi
            if [ "$all_green" != "true" ]; then
              echo "Not all checks pass:"
              printf '%s\n' "$failed"
              return 1
            fi
            echo "All status checks green on $head"
          }

          wait_for_validator() {
            local head="$1" i run_id conclusion
            for i in $(seq 1 30); do
              run_id=$(gh api "/repos/$REPO/actions/runs?head_sha=$head" \
                --jq '[.workflow_runs[] | select(.name == "charly/pr-validator")] | .[0].id // empty')
              if [ -n "$run_id" ]; then break; fi
              echo "waiting for validator run on $head (attempt $i/30)"
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "No validator run found on $head after finalization"
              return 1
            fi
            for i in $(seq 1 30); do
              conclusion=$(gh api "/repos/$REPO/actions/runs/$run_id" --jq '.conclusion // empty')
              if [ -n "$conclusion" ]; then break; fi
              echo "waiting for validator run $run_id to settle (attempt $i/30)"
              sleep 5
            done
            if [ "$conclusion" = "action_required" ] || [ "$conclusion" = "startup_failure" ]; then
              echo "Validator run $run_id ended $conclusion (GITHUB_TOKEN dispatch) — re-running"
              gh api -X POST "/repos/$REPO/actions/runs/$run_id/rerun" >/dev/null
            fi
            for i in $(seq 1 60); do
              n=$(gh api "/repos/$REPO/commits/$head/check-runs" \
                --jq '[.check_runs[] | select(.name == "charly/pr-validator")] | length')
              if [ "$n" -gt 0 ]; then
                echo "validator check-run present on $head"
                return 0
              fi
              echo "waiting for validator check-run on $head (attempt $i/60)"
              sleep 5
            done
            echo "Timed out waiting for validator check-run on $head"
            return 1
          }

          wait_all_settled "$HEAD" "initial" || exit 1
          verify_all_green "$HEAD" || exit 1

          # ---- CHANGELOG finalization ----
          head_repo=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          head_branch=$(gh api "/repos/$REPO/pulls/$PR" --jq '.head.ref')
          if [ "$head_repo" = "$REPO" ]; then
            if git fetch -q origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
                 "+refs/heads/$head_branch:refs/remotes/origin/$head_branch"; then
              placeholder=$(git diff --name-status "origin/$BASE_REF...origin/$head_branch" -- CHANGELOG/ \
                | awk '$1=="A"{print $NF}' \
                | grep -E '^CHANGELOG/[0-9]{4}\.[0-9]{3}\.[0-9]{4}\.md$' | head -1 || true)
              if [ -n "$placeholder" ]; then
                content=$(git show "origin/$head_branch:$placeholder" 2>/dev/null || true)
                if echo "$content" | grep -q "auto-merge-finalized: $(basename "$placeholder" .md)"; then
                  echo "CHANGELOG already finalized — skipping finalization"
                  STAMP=$(basename "$placeholder" .md)
                else
                  stamp=$(date -u +%Y.%j.%H%M)
                  if [ "$(basename "$placeholder" .md)" = "$stamp" ]; then
                    echo "CHANGELOG placeholder already at the merge stamp $stamp"
                    STAMP="$stamp"
                  else
                    echo "Finalizing $placeholder -> CHANGELOG/$stamp.md"
                    if git checkout -q -B dev/auto-merge "origin/$head_branch" \
                       && git mv "$placeholder" "CHANGELOG/$stamp.md" \
                       && sed -i -e "1s/^# [0-9]\{4\}\.[0-9]\{3\}\.[0-9]\{4\}/# $stamp/" \
                                 -e "1a\\<!-- auto-merge-finalized: $stamp -->" "CHANGELOG/$stamp.md" \
                       && git add "CHANGELOG/$stamp.md"; then
                      if git -c user.name='opencharly auto-merge' \
                         -c user.email='actions@github.com' \
                         commit -q -m "docs: finalize CHANGELOG placeholder to $stamp (merge-time CalVer)" \
                         && out=$(git push -q origin "HEAD:$head_branch" 2>&1); then
                        HEAD=$(git rev-parse HEAD)
                        STAMP="$stamp"
                        if ! gh pr view "$PR" --repo "$REPO" --json body --jq .body 2>/dev/null \
                             | grep -q '<!-- auto-merge-finalization-note'; then
                          gh pr view "$PR" --repo "$REPO" --json body --jq .body 2>/dev/null \
                            | { cat; printf '\n\n## Auto-merge finalization\n\nThis run finalized the CHANGELOG at merge time: the placeholder was\nrenamed to `CHANGELOG/%s.md` (H1 rewritten to `# %s`). The current diff\ncarries the finalized file.\n\n<!-- auto-merge-finalization-note: %s -->\n' "$stamp" "$stamp" "$stamp"; } \
                            | gh pr edit "$PR" --repo "$REPO" --body-file - \
                            || echo "  PR body finalization-note update failed — continuing (the re-validation is the gate)"
                        fi
                        echo "CHANGELOG finalized; new head $HEAD — waiting for re-validation"
                        wait_for_validator "$HEAD" || exit 1
                        wait_all_settled "$HEAD" "revalidation" || exit 1
                        verify_all_green "$HEAD" || exit 1
                      else
                        echo "CHANGELOG finalize push failed — falling back to a plain merge"
                      fi
                    else
                      echo "CHANGELOG finalize edit failed — falling back to a plain merge"
                    fi
                  fi
                fi
              else
                echo "No CHANGELOG placeholder in the PR diff — skipping finalization"
              fi
            else
              echo "Could not fetch PR head — skipping finalization"
            fi
          else
            echo "Fork PR (head repo $head_repo) — skipping CHANGELOG finalization"
          fi

          # ---- Merge ----
          echo "All status checks green — merging PR #$PR (squash)"
          gh pr merge "$PR" --squash --auto --delete-branch=false

          for i in $(seq 1 120); do
            sleep 5
            STATE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.state')
            MS=$(gh api "/repos/$REPO/pulls/$PR" --jq '.merge_commit_sha // empty')
            if [ "$STATE" = "closed" ] && [ -n "$MS" ]; then
              if [ -z "$STAMP" ]; then
                STAMP=$(date -u -d "$(gh api "/repos/$REPO/commits/$MS" \
                  --jq '.commit.committer.date')" +%Y.%j.%H%M)
              fi
              VER="$(tag_ver "$STAMP")"
              echo "Merged at $MS — tagging $VER"
              ensure_tag "$VER" "$MS"
              exit 0
            fi
          done

          echo "Timed out waiting for merge"
          exit 1
